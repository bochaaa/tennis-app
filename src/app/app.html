<router-outlet></router-outlet>

<div
  *ngIf="(canInstall$ | async) || (showIosInstallGuide$ | async)"
  class="fixed inset-x-3 bottom-3 z-50 mx-auto max-w-md rounded-lg border border-white/20 bg-[#8f1c1c] p-4 text-white shadow-2xl shadow-black/30"
>
  <div class="flex items-start gap-3">
    <div class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-white text-red-700">
      <svg
        aria-hidden="true"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="M7 10l5 5 5-5" />
        <path d="M12 15V3" />
      </svg>
    </div>

    <div class="min-w-0 flex-1">
      <p class="font-bold">CSI Tenis</p>
      <p *ngIf="canInstall$ | async" class="mt-1 text-sm text-red-50">
        Agrega la app a tu dispositivo.
      </p>
      <div *ngIf="!(canInstall$ | async)" class="mt-1 space-y-1 text-sm text-red-50">
        <p>En iPhone:</p>
        <ol class="list-decimal space-y-1 pl-5">
          <li>Abrir esta pagina en Safari.</li>
          <li>Tocar Compartir.</li>
          <li>Elegir Agregar a pantalla de inicio.</li>
        </ol>
      </div>
      <div class="mt-3 flex flex-wrap gap-2">
        <button
          *ngIf="canInstall$ | async"
          type="button"
          (click)="installApp()"
          class="rounded-lg bg-white px-4 py-2 text-sm font-bold text-red-700 hover:bg-red-50"
        >
          Instalar
        </button>
        <button
          type="button"
          (click)="dismissInstallPrompt()"
          class="rounded-lg border border-white/30 px-4 py-2 text-sm font-semibold hover:bg-white/10"
        >
          Ahora no
        </button>
      </div>
    </div>
  </div>
</div>
