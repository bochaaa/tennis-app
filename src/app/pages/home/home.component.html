<div
  class="min-h-screen bg-[radial-gradient(circle_at_top,_#ef4444_0%,_#b91c1c_50%,_#7f1d1d_100%)] text-white"
>
  <nav class="border-b border-white/20 bg-black/20 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-red-100">Club Sportivo Independiente</p>
        <h1 class="text-3xl font-bold">Tenis</h1>
      </div>

      <div class="flex items-center space-x-4">
        <ng-container *ngIf="isAdmin$ | async">
          <p class="hidden max-w-24 truncate text-right text-sm font-semibold text-red-50 sm:block">
            {{ (currentAdmin$ | async) || 'Admin' }}
          </p>
          <button
            (click)="logout()"
            class="rounded-lg border border-white/30 px-4 py-2 text-sm font-semibold hover:bg-white/10"
          >
            Cerrar sesion
          </button>
        </ng-container>
      </div>
    </div>
  </nav>

  <div class="mx-auto max-w-6xl px-4 py-16">
    <div class="mb-12 text-center">
      <h2 class="mb-3 text-5xl font-bold">Turnos de tenis</h2>
      <p class="text-lg text-red-100">Elegi dia, horario y cancha en pocos pasos.</p>
    </div>

    <div
      class="mx-auto mt-20 max-w-2xl rounded-xl border border-white/20 bg-white/10 p-5 shadow-2xl shadow-black/10 backdrop-blur sm:p-6"
    >
      <div class="grid gap-3">
        <button
          (click)="goToAdminAccess()"
          class="rounded-lg bg-white px-6 py-4 text-base font-bold text-red-700 transition hover:bg-red-50"
        >
          {{ (isAdmin$ | async) ? 'Ir al panel de administracion' : 'Iniciar sesion ' }}
        </button>

        <button
          (click)="bookAsGuest()"
          class="rounded-lg border border-white/30 px-6 py-4 text-base font-bold text-white transition hover:bg-white/10"
        >
          Reservar cancha
        </button>

        <button
          (click)="payReservationAsGuest()"
          class="rounded-lg border border-white/30 px-6 py-4 text-base font-bold text-white transition hover:bg-white/10"
        >
          Pagar turno
        </button>
      </div>
    </div>
  </div>
</div>
